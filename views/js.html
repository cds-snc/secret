<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"
    integrity="sha384-tsQFqpEReu7ZLhBV2VZlAu7zcOV+rXbYlF2cqB8txI/8aZajjp4Bqd+V6D5IgvKT"
    crossorigin="anonymous"></script>

<script language="javascript" type="text/javascript">
    const baseUrl = location.protocol + "//" + location.hostname;
    const lang = "{{.Lang}}";
    const viewId = "{{.ViewId}}";
    const requireAdditionalPassword = {{if .RequireAdditionalPassword}}true{{else}}false{{end}};

    const ENVELOPE_PREFIX = "emc:v2:";
    const PBKDF2_ITERATIONS = 600000;
    const MAX_SECRET_LENGTH = 64000;
    const ENVELOPE_AAD = new TextEncoder().encode("encrypted-message:v2");

    let retrievedSecret = "";
    const dateFormat = (ts) => {
        let a = new Date(ts * 1000);
        let year = a.getFullYear();
        let month = `${a.getMonth() + 1}`.padStart(2, "0")
        let date = `${a.getDate()}`.padStart(2, "0")
        let hour = `${a.getHours()}`.padStart(2, "0")
        let min = `${a.getMinutes()}`.padStart(2, "0")
        let sec = `${a.getSeconds()}`.padStart(2, "0")
        return year + '-' + month + '-' + date + ' ' + hour + ':' + min + ':' + sec;
    }

    const bytesToBase64Url = (bytes) => {
        let binary = "";
        const chunkSize = 0x8000;

        for (let offset = 0; offset < bytes.length; offset += chunkSize) {
            binary += String.fromCharCode(...bytes.subarray(offset, offset + chunkSize));
        }

        return btoa(binary)
            .replace(/\+/g, "-")
            .replace(/\//g, "_")
            .replace(/=+$/, "");
    };

    const base64UrlToBytes = (value) => {
        if (typeof value !== "string" || !/^[A-Za-z0-9_-]+$/.test(value)) {
            throw new Error("Invalid encrypted message encoding");
        }

        const padding = "=".repeat((4 - value.length % 4) % 4);
        const binary = atob(value.replace(/-/g, "+").replace(/_/g, "/") + padding);
        return Uint8Array.from(binary, character => character.charCodeAt(0));
    };

    const deriveEncryptionKey = async (password, salt, usages) => {
        const passwordKey = await crypto.subtle.importKey(
            "raw",
            new TextEncoder().encode(password),
            "PBKDF2",
            false,
            ["deriveKey"],
        );

        return crypto.subtle.deriveKey(
            {
                name: "PBKDF2",
                salt: salt,
                iterations: PBKDF2_ITERATIONS,
                hash: "SHA-256",
            },
            passwordKey,
            { name: "AES-GCM", length: 256 },
            false,
            usages,
        );
    };

    const encrypt = async (secret, password) => {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const nonce = crypto.getRandomValues(new Uint8Array(12));
        const key = await deriveEncryptionKey(password, salt, ["encrypt"]);
        const ciphertext = await crypto.subtle.encrypt(
            {
                name: "AES-GCM",
                iv: nonce,
                additionalData: ENVELOPE_AAD,
            },
            key,
            new TextEncoder().encode(secret),
        );

        // Compact field names keep the envelope overhead low. Parameters are
        // embedded so a later format version can safely choose new values.
        const envelope = {
            v: 2,
            k: "PBKDF2-SHA-256",
            i: PBKDF2_ITERATIONS,
            s: bytesToBase64Url(salt),
            c: "AES-256-GCM",
            n: bytesToBase64Url(nonce),
            d: bytesToBase64Url(new Uint8Array(ciphertext)),
        };

        return ENVELOPE_PREFIX + JSON.stringify(envelope);
    };

    const parseV2Envelope = (secret) => {
        if (typeof secret !== "string" || !secret.startsWith(ENVELOPE_PREFIX)) {
            throw new Error("Unsupported encrypted message format");
        }

        const envelope = JSON.parse(secret.substring(ENVELOPE_PREFIX.length));
        const fields = Object.keys(envelope).sort().join(",");

        // Requiring this version's exact bounded parameters prevents a crafted
        // message from requesting an excessive amount of browser work.
        if (
            fields !== "c,d,i,k,n,s,v" ||
            envelope.v !== 2 ||
            envelope.k !== "PBKDF2-SHA-256" ||
            envelope.i !== PBKDF2_ITERATIONS ||
            envelope.c !== "AES-256-GCM"
        ) {
            throw new Error("Unsupported encrypted message format");
        }

        const salt = base64UrlToBytes(envelope.s);
        const nonce = base64UrlToBytes(envelope.n);
        const ciphertext = base64UrlToBytes(envelope.d);

        if (salt.length !== 16 || nonce.length !== 12 || ciphertext.length < 16) {
            throw new Error("Invalid encrypted message parameters");
        }

        return { salt, nonce, ciphertext };
    };

    const decryptV2 = async (secret, password) => {
        const { salt, nonce, ciphertext } = parseV2Envelope(secret);

        const key = await deriveEncryptionKey(password, salt, ["decrypt"]);
        const plaintext = await crypto.subtle.decrypt(
            {
                name: "AES-GCM",
                iv: nonce,
                additionalData: ENVELOPE_AAD,
            },
            key,
            ciphertext,
        );

        return new TextDecoder("utf-8", { fatal: true }).decode(plaintext);
    };

    const showGenerateError = (message) => {
        $("#generate-error").text(message).removeClass("d-none");
        $("#generate-btn").prop("disabled", false).removeClass("bg-opacity-20");
    };

    const hideGenerateError = () => {
        $("#generate-error").addClass("d-none").text("");
    };

    const retrieveEncryption = (id) => {
        $.ajax({
            type: "GET",
            url: `/decrypt/${id}`,
            async: true,
            success: function (data) {
                retrievedSecret = data.body;
                if (data.client_encrypted) {
                    $("#secret").val("");
                    $("#decrypt-controls").removeClass("d-none");
                } else {
                    $("#secret").val(data.body);
                }
                $("#confirm-div").toggleClass("d-none");
                $("#secret-div").toggleClass("d-none");
            },
            error: function () {
                $("#confirm-div").toggleClass("d-none");
                $("#404-div").toggleClass("d-none");
            }
        });
    }

    const submitEncryption = (body, ttl, clientEncrypted) => {
        $.ajax({
            type: "POST",
            url: "/encrypt",
            dataType: "json",
            async: true,
            contentType: "application/json",
            data: JSON.stringify({ body: body, ttl: ttl, client_encrypted: clientEncrypted }),
            success: function (data) {
                $("#link").val(`${baseUrl}/${lang}/view/${data.id}`);
                $("#link").prop("readonly", true);
                $("#burn-btn").data('id', data.id);
                $("#generate-div").toggleClass("d-none");
                $("#link-div").toggleClass("d-none");
            },
            error: function () {
                showGenerateError("{{t `Unable to create the secret link. Please try again.` .Lang }}");
            },
        });
    };

    const validateRequiredAdditionalPassword = () => {
        const passwordInput = $("#optional_pass")[0];
        if (passwordInput && typeof passwordInput.validate === "function") {
            passwordInput.validate();
        }
    }

    $("#burn-btn").click(() => {
        let id = $("#burn-btn").data("id")
        $.ajax({
            type: "DELETE",
            url: `/delete/${id}`,
            async: true,
            success: function () {
                window.location = `/${lang}`
            },
        });
    })

    $("#decrypt-btn").click(async () => {
        const password = $("#optional_pass").val();
        $("#decrypt-error").addClass("d-none");
        $("#decrypt-btn").prop("disabled", true).addClass("bg-opacity-20");

        try {
            const result = await decryptV2(retrievedSecret, password);
            $("#secret").val(result);
            retrievedSecret = "";
            $("#decrypt-controls").addClass("d-none");
        } catch (error) {
            $("#decrypt-error").removeClass("d-none");
        } finally {
            $("#decrypt-btn").prop("disabled", false).removeClass("bg-opacity-20");
        }
    })

    $("#generate-btn").click(async () => {
        hideGenerateError();

        const generateBtn = $("#generate-btn")
        generateBtn.prop('disabled', true)
        generateBtn.addClass("bg-opacity-20")
        const password = $("#optional_pass").val() || "";

        if (requireAdditionalPassword && password == "") {
            validateRequiredAdditionalPassword()
            generateBtn.prop('disabled', false)
            generateBtn.removeClass("bg-opacity-20")
            return;
        }

        let ttl = parseInt($("#ttl").val());
        ttl = Math.floor(Date.now() / 1000) + ttl;

        $("#expires-in").text(dateFormat(ttl))

        try {
            const clientEncrypted = password !== "";
            const secret = clientEncrypted
                ? await encrypt($("#secret").val(), password)
                : $("#secret").val();

            if (new TextEncoder().encode(secret).length > MAX_SECRET_LENGTH) {
                showGenerateError("{{t `The secret is too long after encryption. Please shorten it.` .Lang }}");
                return;
            }

            submitEncryption(secret, ttl, clientEncrypted);
        } catch (error) {
            showGenerateError("{{t `Unable to encrypt the secret. Please try again.` .Lang }}");
        }
    });

    $("#view-btn").click(() => {
        $("#view-btn").prop('disabled', true)
        $('#view-btn').addClass("bg-opacity-20")
        retrieveEncryption(viewId)
    })
</script>
